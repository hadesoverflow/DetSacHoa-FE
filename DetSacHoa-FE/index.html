        // Bảo đảm cuộn chuột (mouse wheel) tự nhiên, mượt mà trên tất cả các trang
        window.addEventListener('wheel', function(e) {
            if (document.body && document.body.classList.contains('not-home')) {
                e.stopPropagation();
                return;
            }
            if (e.target && typeof e.target.closest === 'function') {
                var s = e.target.closest('.products-page, .collections-page, .about-page, .ai-studio-overlay, .ai-studio-body, .ai-studio-panel-left, .ai-studio-panel-right, .admin-layout, .admin-content-body, .admin-sidebar-menu, .login-overlay, [style*="overflow"]');
                if (s) {
                    e.stopPropagation();
                    return;
                }
            }
        }, { capture: true, passive: true });
    </script>
